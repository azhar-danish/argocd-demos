apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-child       # Child app name
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/azhar-danish/argocd-demos.git # Repo containing child apps(that you have forked and cloned earlier)
    targetRevision: main
    path: projects/backend/app  # path of Online Shop app in `argocd-demos` repo
  destination:
    server: https://172.31.8.148:33893 # Replace with your Cluster Url, To get run: `argocd cluster list`
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
